<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'"
    />
    <title>uwu-term</title>
    <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css" />
    <link rel="stylesheet" href="assets.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="frame">
      <header id="titlebar">
        <div id="brand"><span class="logo"></span><span class="name">uwu-term</span></div>
        <nav id="tabs"></nav>
        <button id="new-tab" title="new tab (Ctrl+Shift+T)">＋</button>
        <div id="spacer"></div>
        <div id="mascot"></div>
        <div id="controls">
          <button id="min" title="minimise"></button>
          <button id="max" title="maximise"></button>
          <button id="close" title="close"></button>
        </div>
      </header>
      <main id="terminals"></main>
      <div id="bubble"></div>
    </div>
    <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
    <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
    <script src="../node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
    <script src="../node_modules/@xterm/addon-webgl/lib/addon-webgl.js"></script>
    <script src="app.js"></script>
  </body>
</html>
